<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="manifest" href="/manifest.webmanifest" />

<title>Fulfillment Dashboard</title>
<style>
:root { --bg:#0f172a; --panel:#111827; --muted:#9ca3af; --text:#e5e7eb; --accent:#22c55e; --warn:#f59e0b; --danger:#ef4444; }
html,body,#root{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji","Segoe UI Emoji"}
a{color:inherit;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #334155;border-radius:10px;padding:8px 12px;background:#0b1220;cursor:pointer}
.btn:hover{background:#0d1526}
.tag{border:1px solid #334155;border-radius:999px;padding:2px 8px;color:#cbd5e1}
.status{font-weight:600}
.status.printing{color:var(--accent)}
.status.queued{color:#60a5fa}
.status.packaging{color:var(--warn)}
.status.error{color:var(--danger)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px;border-bottom:1px solid #1f2937}
input,select{background:#0b1220;color:var(--text);border:1px solid #334155;border-radius:8px;padding:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
