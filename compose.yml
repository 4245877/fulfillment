services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfillment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment_password
    ports:
      - "5433:5432"
    volumes:
      - fulfillment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: fulfillment-api
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
      - apps/api/.env
    environment:
      CI: "true"
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://fulfillment:fulfillment_password@postgres:5432/fulfillment
      BACKUP_SSH_USER: miha
      BACKUP_SSH_HOST: 192.168.0.135
      BACKUP_SSH_KEY: /run/secrets/lite_forest_ops
      BACKUP_REMOTE_PROJECT_ROOT: /home/miha/app
      BACKUP_REMOTE_SCRIPT: /home/miha/app/ops/backups/backup.sh
      BACKUP_REMOTE_CHECK_SCRIPT: /home/miha/app/ops/backups/check-backup.sh
      BACKUP_REMOTE_STATUS_FILE: /mnt/fast_data/backups/lite-forest/state/backup-status.json
      BACKUP_REMOTE_ARCHIVES_DIR: /mnt/fast_data/backups/lite-forest/archives
      BACKUP_DEST_HOST: 192.168.0.139
      BACKUP_DEST_DISK: SSD 240 GB
      BACKUP_RETENTION_DAYS: "28"
      PRICING_REMOTE_FILE: /home/miha/app/services/ingester/data/pricing.yml
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_api_node_modules:/app/apps/api/node_modules
      - /home/miha/.ssh/lite_forest_ops:/run/secrets/lite_forest_ops:ro
    command: >
      sh -c "apk add --no-cache openssh-client &&
             corepack enable &&
             pnpm install --no-frozen-lockfile &&
             pnpm --filter @drukarnya/fulfillment-api start"
    ports:
      - "3001:8080"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
      args:
        # Bakes the admin token into the SPA so the operator UI can call the
        # admin-gated endpoints. Sourced from ADMIN_TOKEN in the root .env.
        VITE_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    container_name: fulfillment-dashboard
    restart: unless-stopped
    ports:
      - "4173:80"
    volumes:
      - ./apps/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Bridges the Creality K2's proprietary WebRTC camera into a JPEG snapshot the
  # API can fetch at http://go2rtc:1984/api/frame.jpeg?src=k2 (the K2 exposes no
  # plain MJPEG/snapshot endpoint of its own). Set that URL as the K2's
  # "URL знімка камери" in the dashboard printer manager.
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: fulfillment-go2rtc
    restart: unless-stopped
    environment:
      # Replace the IP with your K2's. Stock firmware below v1.1.5.5 serves the
      # camera's WebRTC signaling on :8000; newer firmware moved it (port 8000
      # was disabled "for security"). Open http://<server>:1984 to confirm the
      # `k2` stream connects, and adjust the host/port here if it does not.
      K2_CAMERA_SOURCE: "webrtc:http://192.168.0.132:8000/call/webrtc_local#format=creality"
    volumes:
      - ./infra/go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      # go2rtc web UI / API — handy for verifying the camera bridge.
      - "1984:1984"

volumes:
  api_node_modules:
  api_api_node_modules:
  fulfillment_pgdata: