services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfillment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment_password
    ports:
      - "5433:5432"
    volumes:
      - fulfillment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: fulfillment-api
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
      - apps/api/.env
    environment:
      CI: "true"
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://fulfillment:fulfillment_password@postgres:5432/fulfillment
      BACKUP_SSH_USER: miha
      BACKUP_SSH_HOST: 192.168.0.135
      BACKUP_SSH_KEY: /run/secrets/lite_forest_ops
      BACKUP_REMOTE_PROJECT_ROOT: /home/miha/app
      BACKUP_REMOTE_SCRIPT: /home/miha/app/ops/backups/backup.sh
      BACKUP_REMOTE_CHECK_SCRIPT: /home/miha/app/ops/backups/check-backup.sh
      BACKUP_REMOTE_STATUS_FILE: /mnt/fast_data/backups/lite-forest/state/backup-status.json
      BACKUP_REMOTE_ARCHIVES_DIR: /mnt/fast_data/backups/lite-forest/archives
      BACKUP_DEST_HOST: 192.168.0.139
      BACKUP_DEST_DISK: SSD 240 GB
      BACKUP_RETENTION_DAYS: "28"
      PRICING_REMOTE_FILE: /home/miha/app/services/ingester/data/pricing.yml
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_api_node_modules:/app/apps/api/node_modules
      - /home/miha/.ssh/lite_forest_ops:/run/secrets/lite_forest_ops:ro
    command: >
      sh -c "apk add --no-cache openssh-client &&
             corepack enable &&
             pnpm install --no-frozen-lockfile &&
             pnpm --filter @drukarnya/fulfillment-api start"
    ports:
      - "3001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness only: the API must answer HTTP. Readiness (/ready) and the
      # printer-orchestrator integration are deliberately NOT part of this
      # check — an atelier outage must degrade the printers page, not flap
      # this container.
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "--timeout=3",
          "http://127.0.0.1:8080/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - default
      # Reaches the atelier print-orchestrator by its compose DNS name
      # (http://print-orchestrator:3100, see PRINTER_ORCHESTRATOR_URL) without
      # publishing the orchestrator API on the LAN or pinning a host IP. The
      # API only *dials* the orchestrator at request time, so atelier being
      # down never prevents this container from starting.
      - print-farm

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
      args:
        # Bakes the admin token into the SPA so the operator UI can call the
        # admin-gated endpoints. Sourced from ADMIN_TOKEN in the root .env.
        VITE_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
        # Address of the atelier print-dashboard for the link on the read-only
        # printers page (e.g. http://192.168.0.139:8090/). Optional: when
        # empty the link is hidden. Sourced from the root .env.
        VITE_ATELIER_DASHBOARD_URL: ${ATELIER_DASHBOARD_URL:-}
    container_name: fulfillment-dashboard
    restart: unless-stopped
    ports:
      - "4173:80"
    volumes:
      - ./apps/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  api_node_modules:
  api_api_node_modules:
  fulfillment_pgdata:

networks:
  # Shared cross-project bridge between fulfillment and the atelier
  # print-orchestrator. Deliberately NOT a compose-managed network: the
  # auto-generated names (atelier_default / fulfillment_default) depend on the
  # projects' directory names, and neither stack should have to exist before
  # the other. Create it once (idempotent) before the first `up` of EITHER
  # stack:
  #   ./ops/ensure-print-farm-network.sh
  # If it is missing, compose fails fast with
  #   network print-farm declared as external, but could not be found
  # — run the script above and `docker compose up -d` again.
  print-farm:
    external: true
    name: print-farm