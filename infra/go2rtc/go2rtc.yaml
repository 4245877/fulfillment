# go2rtc bridges the Creality K2's proprietary WebRTC camera (which has no
# plain HTTP MJPEG/snapshot endpoint) into a JPEG still the fulfillment API can
# fetch over the compose network:
#
#   http://go2rtc:1984/api/frame.jpeg?src=k2
#
# Set that URL as the "URL знімка камери" (snapshotUrl) for the K2 in the
# dashboard's printer manager.
#
# The source URL is injected via the K2_CAMERA_SOURCE env var (see compose.yml)
# so the printer IP/port lives in one place. The `#format=creality` modifier is
# what teaches go2rtc the K2's base64-JSON-over-HTTP signaling handshake.
streams:
  k2: ${K2_CAMERA_SOURCE}

api:
  listen: ":1984"

log:
  level: info
